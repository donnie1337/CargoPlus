storage:
  file: data.yml

default-group: membro

# Cores que podem ser escolhidas para o texto enviado pelo jogador.
# Estas cores NÃO alteram a cor do nickname nem a cor do cargo.
chat:
  default-color: branco
  colors:
    branco: "&f"
    cinza: "&7"
    vermelho: "&c"
    vermelho-escuro: "&4"
    verde: "&a"
    verde-escuro: "&2"
    azul: "&9"
    azul-claro: "&b"
    amarelo: "&e"
    dourado: "&6"
    rosa: "&d"
    roxo: "&5"
    aqua: "&3"

# Animações especiais dos cargos.
# O DEV mantém o small caps e o gradiente roxo -> azul.
# A animação apenas faz as letras piscarem em branco e depois volta ao gradiente.
animacoes:
  dev:
    ativado: true
    intervalo-segundos: 3
    duracao-branco-letra-ms: 300
    duracao-normal-letra-ms: 150
    duracao-branco-total-ms: 250
    duracao-normal-total-ms: 250
    piscadas-totais: 3

# A cor do cargo é definida em name-color.
# Essa mesma cor é aplicada ao prefixo/cargo, nickname e futuramente ao TAB.
# Não existe uma cor separada para o nickname.
hierarchy:
  - membro
  - ajudante
  - moderador
  - administrador
  - gerente
  - dev

groups:
  membro:
    display-name: "Membro"
    prefix: ""
    name-color: "cinza"
    permissions:
      - chatplus.local
      - chatplus.global
      - essentialsplus.tpa
    parents: []
  ajudante:
    display-name: "Ajudante"
    prefix: "&l<gradient:#FFF176:#FBC02D>[Ajudante]</gradient> "
    name-color: "amarelo"
    permissions:
      - chatplus.local
      - chatplus.staff
      - chatplus.cor
      - utilidadesplus.configurar
      - essentialsplus.tpa
      - essentialsplus.vanish
      - essentialsplus.inspect
      - essentialsplus.ec
      - essentialsplus.bau
    parents:
      - membro
  moderador:
    display-name: "Moderador"
    prefix: "&l<gradient:#66BB6A:#1B5E20>[Moderador]</gradient> "
    name-color: "verde-escuro"
    permissions:
      - chatplus.local
      - chatplus.staff
      - chatplus.cor
      - utilidadesplus.configurar
      - essentialsplus.tpa
      - essentialsplus.vanish
      - essentialsplus.inspect
    parents:
      - ajudante
  administrador:
    display-name: "Administrador"
    prefix: "&l<gradient:#EF5350:#B71C1C>[ADM]</gradient> "
    name-color: "vermelho"
    permissions:
      - chatplus.local
      - chatplus.global
      - chatplus.staff
      - chatplus.cor
      - utilidadesplus.configurar
      - essentialsplus.tpa
      - essentialsplus.vanish
      - essentialsplus.inspect
    parents:
      - moderador
  gerente:
    display-name: "Gerente"
    prefix: "&l<gradient:#FFD54F:#FF8F00>[Gerente]</gradient> "
    name-color: "dourado"
    permissions:
      - chatplus.local
      - chatplus.global
      - chatplus.staff
      - chatplus.cor
      - utilidadesplus.configurar
      - essentialsplus.tpa
      - essentialsplus.vanish
      - essentialsplus.inspect
    parents:
      - administrador
  dev:
    display-name: "ᴅᴇᴠ"
    prefix: "&l<gradient:#8A2BE2:#2196F3>[ᴅᴇᴠ]</gradient> "
    name-color: "vermelho-escuro"
    permissions:
      - chatplus.local
      - chatplus.global
      - chatplus.staff
      - chatplus.admin
      - chatplus.comandos.servidor
      - cargoplus.promover
      - cargoplus.setcargo
      - cargoplus.removercargo
      - cargoplus.admin
      - chatplus.cor
      - utilidadesplus.plugins
      - utilidadesplus.configurar
      - utilidadesplus.motd.admin
      - essentialsplus.tpa
      - essentialsplus.vanish
      - essentialsplus.inspect
    parents:
      - gerente
