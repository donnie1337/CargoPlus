# ============================================================
# CargoPlus - Configuração principal
# ============================================================
#
# As chaves técnicas abaixo são mantidas por compatibilidade com
# o código atual do plugin. Os comentários e a organização estão
# padronizados em português sem alterar cargos, permissões ou mensagens.
# ============================================================

# Arquivo onde os dados dos cargos são armazenados.
storage:
  file: data.yml

# Cargo atribuído automaticamente a jogadores sem outro cargo.
default-group: membro

# ------------------------------------------------------------
# CORES DO CHAT
# ------------------------------------------------------------
# Estas cores alteram somente o texto enviado pelo jogador.
# Não alteram a cor do nickname nem a cor do cargo.
chat:
  default-color: branco
  colors:
    branco: "&f"
    cinza: "&7"
    vermelho: "&c"
    vermelho-escuro: "&4"
    verde: "&a"
    verde-escuro: "&2"
    azul: "&9"
    azul-claro: "&b"
    amarelo: "&e"
    dourado: "&6"
    rosa: "&d"
    roxo: "&5"
    aqua: "&3"

# ------------------------------------------------------------
# ANIMAÇÕES DOS CARGOS
# ------------------------------------------------------------
# Somente o DEV utiliza a animação especial.
# O small caps e o gradiente roxo -> azul são preservados.
# A animação faz as letras piscarem em branco e retorna ao gradiente.
animacoes:
  dev:
    ativado: true
    intervalo-segundos: 3
    duracao-branco-letra-ms: 300
    duracao-normal-letra-ms: 150
    duracao-branco-total-ms: 250
    duracao-normal-total-ms: 250
    piscadas-totais: 3

# ------------------------------------------------------------
# HIERARQUIA DOS CARGOS
# ------------------------------------------------------------
# A ordem abaixo define a hierarquia de menor para maior.
hierarchy:
  - membro
  - ajudante
  - moderador
  - administrador
  - gerente
  - dev

# ------------------------------------------------------------
# CARGOS
# ------------------------------------------------------------
groups:
  membro:
    display-name: "Membro"
    prefix: ""
    name-color: "cinza"
    permissions:
      - chatplus.local
      - chatplus.global
      - essentialsplus.tpa
      - essentialsplus.tell
      - clanplus.clan
    parents: []
  ajudante:
    display-name: "Ajudante"
    prefix: "&l<gradient:#FFF176:#FBC02D>[Ajudante]</gradient> "
    name-color: "amarelo"
    permissions:
      - chatplus.local
      - chatplus.staff
      - chatplus.cor
      - utilidadesplus.configurar
      - essentialsplus.tpa
      - essentialsplus.vanish
      - essentialsplus.inspect
      - essentialsplus.ec
      - essentialsplus.bau
      - essentialsplus.tell
    parents:
      - membro
  moderador:
    display-name: "Moderador"
    prefix: "&l<gradient:#66BB6A:#1B5E20>[Moderador]</gradient> "
    name-color: "verde-escuro"
    permissions:
      - chatplus.local
      - chatplus.staff
      - chatplus.cor
      - utilidadesplus.configurar
      - essentialsplus.tpa
      - essentialsplus.vanish
      - essentialsplus.inspect
      - essentialsplus.tell
    parents:
      - ajudante
  administrador:
    display-name: "Administrador"
    prefix: "&l<gradient:#EF5350:#B71C1C>[ADM]</gradient> "
    name-color: "vermelho"
    permissions:
      - chatplus.local
      - chatplus.global
      - chatplus.staff
      - chatplus.cor
      - utilidadesplus.configurar
      - essentialsplus.tpa
      - essentialsplus.vanish
      - essentialsplus.inspect
      - essentialsplus.tell
    parents:
      - moderador
  gerente:
    display-name: "Gerente"
    prefix: "&l<gradient:#FFD54F:#FF8F00>[Gerente]</gradient> "
    name-color: "dourado"
    permissions:
      - chatplus.local
      - chatplus.global
      - chatplus.staff
      - chatplus.cor
      - utilidadesplus.configurar
      - essentialsplus.tpa
      - essentialsplus.vanish
      - essentialsplus.inspect
      - essentialsplus.tell
    parents:
      - administrador
  dev:
    display-name: "ᴅᴇᴠ"
    prefix: "&l<gradient:#8A2BE2:#2196F3>[ᴅᴇᴠ]</gradient> "
    name-color: "vermelho-escuro"
    permissions:
      - chatplus.local
      - chatplus.global
      - chatplus.staff
      - chatplus.admin
      - chatplus.comandos.servidor
      - cargoplus.promover
      - cargoplus.setcargo
      - cargoplus.removercargo
      - cargoplus.admin
      - chatplus.cor
      - utilidadesplus.plugins
      - utilidadesplus.configurar
      - utilidadesplus.motd.admin
      - essentialsplus.tpa
      - essentialsplus.vanish
      - essentialsplus.inspect
      - essentialsplus.tell
      - clanplus.admin
    parents:
      - gerente
