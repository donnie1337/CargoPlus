storage:
  file: data.yml

default-group: membro

# Mensagens de entrada por cargo.
# Somente os cargos com ativado: true exibem uma mensagem quando um jogador desse cargo entra.
# As 5 frases abaixo são escolhidas aleatoriamente para cada entrada.
# Placeholders: %player% = nome do jogador | %cargo% = nome exibido do cargo.
mensagens-entrada:
  membro:
    ativado: true
    mensagens:
      - "[%cargo%] %player% olha quem apareceu!"
      - "[%cargo%] %player% acabou de chegar!"
      - "[%cargo%] %player% está entre nós!"
      - "[%cargo%] %player% chegou chegando!"
      - "[%cargo%] %player% deu as caras por aqui!"
  ajudante:
    ativado: true
    mensagens:
      - "[%cargo%] %player% olha quem apareceu!"
      - "[%cargo%] %player% acabou de chegar!"
      - "[%cargo%] %player% está entre nós!"
      - "[%cargo%] %player% chegou chegando!"
      - "[%cargo%] %player% deu as caras por aqui!"
  moderador:
    ativado: true
    mensagens:
      - "[%cargo%] %player% olha quem apareceu!"
      - "[%cargo%] %player% acabou de chegar!"
      - "[%cargo%] %player% está entre nós!"
      - "[%cargo%] %player% chegou chegando!"
      - "[%cargo%] %player% deu as caras por aqui!"
  administrador:
    ativado: true
    mensagens:
      - "[%cargo%] %player% olha quem apareceu!"
      - "[%cargo%] %player% acabou de chegar!"
      - "[%cargo%] %player% está entre nós!"
      - "[%cargo%] %player% chegou chegando!"
      - "[%cargo%] %player% deu as caras por aqui!"
  gerente:
    ativado: true
    mensagens:
      - "[%cargo%] %player% olha quem apareceu!"
      - "[%cargo%] %player% acabou de chegar!"
      - "[%cargo%] %player% está entre nós!"
      - "[%cargo%] %player% chegou chegando!"
      - "[%cargo%] %player% deu as caras por aqui!"
  dono:
    ativado: true
    mensagens:
      - "[%cargo%] %player% olha quem apareceu!"
      - "[%cargo%] %player% acabou de chegar!"
      - "[%cargo%] %player% está entre nós!"
      - "[%cargo%] %player% chegou chegando!"
      - "[%cargo%] %player% deu as caras por aqui!"

# Mensagens de saída por cargo.
# O mesmo sistema pode ser ativado/desativado e personalizado separadamente da entrada.
mensagens-saida:
  membro:
    ativado: false
    mensagem: "&8[&c-&8] &f%player% &7saiu do servidor!"
  ajudante:
    ativado: false
    mensagem: "&8[&c-&8] &e[Ajudante] &f%player% &7saiu do servidor!"
  moderador:
    ativado: false
    mensagem: "&8[&c-&8] &2[Moderador] &f%player% &7saiu do servidor!"
  administrador:
    ativado: false
    mensagem: "&8[&c-&8] &c[ADM] &f%player% &7saiu do servidor!"
  gerente:
    ativado: false
    mensagem: "&8[&c-&8] &6[Gerente] &f%player% &7saiu do servidor!"
  dono:
    ativado: false
    mensagem: "&8[&c-&8] &4[Dono] &f%player% &7saiu do servidor!"

# Cores que podem ser escolhidas para o texto enviado pelo jogador.
# Estas cores NÃO alteram a cor do nickname nem a cor do cargo.
chat:
  default-color: branco
  colors:
    branco: "&f"
    cinza: "&7"
    vermelho: "&c"
    vermelho-escuro: "&4"
    verde: "&a"
    verde-escuro: "&2"
    azul: "&9"
    azul-claro: "&b"
    amarelo: "&e"
    dourado: "&6"
    rosa: "&d"
    roxo: "&5"
    aqua: "&3"

# A cor do cargo é definida em name-color.
# Essa mesma cor é aplicada ao prefixo/cargo, nickname e futuramente ao TAB.
# Não existe uma cor separada para o nickname.
hierarchy:
  - membro
  - ajudante
  - moderador
  - administrador
  - gerente
  - dono

groups:
  membro:
    display-name: "Membro"
    prefix: ""
    name-color: "branco"
    permissions:
      - chatplus.local
    parents: []
  ajudante:
    display-name: "Ajudante"
    prefix: "&e[Ajudante] "
    name-color: "amarelo"
    permissions:
      - chatplus.local
      - chatplus.staff
    parents:
      - membro
  moderador:
    display-name: "Moderador"
    prefix: "&2[Moderador] "
    name-color: "verde-escuro"
    permissions:
      - chatplus.local
      - chatplus.staff
    parents:
      - ajudante
  administrador:
    display-name: "Administrador"
    prefix: "&c[ADM] "
    name-color: "vermelho"
    permissions:
      - chatplus.local
      - chatplus.global
      - chatplus.staff
    parents:
      - moderador
  gerente:
    display-name: "Gerente"
    prefix: "&6[Gerente] "
    name-color: "dourado"
    permissions:
      - chatplus.local
      - chatplus.global
      - chatplus.staff
    parents:
      - administrador
  dono:
    display-name: "Dono"
    prefix: "&4[Dono] "
    name-color: "vermelho-escuro"
    permissions:
      - chatplus.local
      - chatplus.global
      - chatplus.staff
      - cargoplus.promover
      - cargoplus.setcargo
      - cargoplus.removercargo
      - cargoplus.admin
      - chatplus.cor
      - utilidadesplus.plugins
      - utilidadesplus.configurar
    parents:
      - gerente
