storage:
  file: data.yml

default-group: membro

# Os cargos e a ordem de promoção são definidos aqui.
# Para criar ou renomear cargos, altere somente este arquivo.
hierarchy:
  - membro
  - ajudante
  - moderador
  - administrador
  - gerente
  - dono

groups:
  membro:
    display-name: "Membro"
    prefix: ""
    permissions:
      - chat.local
    parents: []
  ajudante:
    display-name: "Ajudante"
    prefix: "&7[Ajudante] "
    permissions:
      - chat.local
      - chat.staff
    parents:
      - membro
  moderador:
    display-name: "Moderador"
    prefix: "&2[Moderador] "
    permissions:
      - chat.local
      - chat.staff
    parents:
      - ajudante
  administrador:
    display-name: "Administrador"
    prefix: "&c[ADM] "
    permissions:
      - chat.local
      - chat.global
      - chat.staff
    parents:
      - moderador
  gerente:
    display-name: "Gerente"
    prefix: "&6[Gerente] "
    permissions:
      - chat.local
      - chat.global
      - chat.staff
      - cargoplus.promover
      - cargoplus.setcargo
      - cargoplus.removercargo
    parents:
      - administrador
  dono:
    display-name: "Dono"
    prefix: "&4[Dono] "
    permissions:
      - chat.local
      - chat.global
      - chat.staff
      - chat.admin
      - cargoplus.promover
      - cargoplus.setcargo
      - cargoplus.removercargo
      - cargoplus.admin
    parents:
      - gerente
