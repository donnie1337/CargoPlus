storage:
  file: data.yml

default-group: membro

# Os cargos existentes e a ordem de promoção são definidos aqui.
# Para criar outro cargo, adicione uma nova entrada em groups e coloque o nome
# na posição desejada da hierarchy. Não existe comando para criar cargos.
hierarchy:
  - membro
  - ajudante
  - moderador
  - administrador
  - gerente
  - dono

groups:
  membro:
    display-name: "Membro"
    prefix: ""
    permissions: []
    parents: []
  ajudante:
    display-name: "Ajudante"
    prefix: "&7[Ajudante] "
    permissions:
      - chat.staff
    parents:
      - membro
  moderador:
    display-name: "Moderador"
    prefix: "&2[Moderador] "
    permissions:
      - chat.staff
    parents:
      - ajudante
  administrador:
    display-name: "Administrador"
    prefix: "&c[Admin] "
    permissions:
      - chat.global
      - chat.staff
    parents:
      - moderador
  gerente:
    display-name: "Gerente"
    prefix: "&6[Gerente] "
    permissions:
      - chat.global
      - chat.staff
    parents:
      - administrador
  dono:
    display-name: "Dono"
    prefix: "&4[Dono] "
    permissions:
      - chat.global
      - chat.staff
      - chat.admin
    parents:
      - gerente
