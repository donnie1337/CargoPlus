storage:
  file: data.yml

default-group: membro

# Cores disponíveis para o nickname.
# Os nomes abaixo podem ser usados no /cor <cor>.
# O código deve ser uma cor simples do Minecraft.
nickname:
  default-color: branco
  colors:
    branco: "&f"
    cinza: "&7"
    vermelho: "&c"
    verde: "&a"
    verde-escuro: "&2"
    azul: "&9"
    azul-claro: "&b"
    amarelo: "&e"
    dourado: "&6"
    laranja: "&6"
    rosa: "&d"
    roxo: "&5"
    aqua: "&3"
    preto: "&0"

# Os cargos e a ordem de promoção são definidos aqui.
# Para criar ou renomear cargos, altere somente este arquivo.
hierarchy:
  - membro
  - ajudante
  - moderador
  - administrador
  - gerente
  - dono

groups:
  membro:
    display-name: "Membro"
    prefix: ""
    name-color: "branco"
    permissions:
      - chat.local
    parents: []
  ajudante:
    display-name: "Ajudante"
    prefix: "&7[Ajudante] "
    name-color: "cinza"
    permissions:
      - chat.local
      - chat.staff
    parents:
      - membro
  moderador:
    display-name: "Moderador"
    prefix: "&2[Moderador] "
    name-color: "verde-escuro"
    permissions:
      - chat.local
      - chat.staff
    parents:
      - ajudante
  administrador:
    display-name: "Administrador"
    prefix: "&c[ADM] "
    name-color: "vermelho"
    permissions:
      - chat.local
      - chat.global
      - chat.staff
      - cargoplus.cor
    parents:
      - moderador
  gerente:
    display-name: "Gerente"
    prefix: "&6[Gerente] "
    name-color: "dourado"
    permissions:
      - chat.local
      - chat.global
      - chat.staff
      - cargoplus.cor
    parents:
      - administrador
  dono:
    display-name: "Dono"
    prefix: "&4[Dono] "
    name-color: "roxo"
    permissions:
      - chat.local
      - chat.global
      - chat.staff
      - chat.admin
      - cargoplus.promover
      - cargoplus.setcargo
      - cargoplus.removercargo
      - cargoplus.admin
      - cargoplus.cor
    parents:
      - gerente
