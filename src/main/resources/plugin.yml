name: CargoPlus
version: 1.0.0
main: com.cargoplus.CargoPlus
api-version: '26.2'
author: donnie1337
description: Sistema seguro de cargos e permissoes.
softdepend:
  - AuthSystem
commands:
  promover:
    description: Promove um jogador para o próximo cargo da hierarquia.
    usage: /promover <jogador>
  setcargo:
    description: Define um cargo configurado para um jogador.
    usage: /setcargo <jogador> <cargo>
  removercargo:
    description: Remove o cargo personalizado e retorna o jogador ao cargo padrão.
    usage: /removercargo <jogador>
  cor:
    description: Altera a cor do seu nickname sem alterar a cor do cargo.
    usage: /cor <cor>
  cargo:
    description: Administração do CargoPlus.
    usage: /cargo <promover|setcargo|removercargo|cor|reload>
    aliases:
      - cargoplus
permissions:
  cargoplus.promover:
    description: Permite promover jogadores dentro da hierarquia configurada.
    default: false
  cargoplus.setcargo:
    description: Permite definir cargos configurados para jogadores.
    default: false
  cargoplus.removercargo:
    description: Permite remover o cargo de jogadores.
    default: false
  cargoplus.cor:
    description: Permite alterar a cor do próprio nickname.
    default: false
  cargoplus.admin:
    description: Permite recarregar o CargoPlus e administrar o comando principal.
    default: false
