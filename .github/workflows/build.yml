name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Validar ambiente Java e Maven
        run: |
          set -euo pipefail
          echo '=== java -version ==='
          java -version
          echo '=== javac -version ==='
          javac -version
          echo '=== mvn -version ==='
          mvn -version
          echo '=== JAVA_HOME ==='
          echo "$JAVA_HOME"
      - name: Build
        run: mvn -B clean package
